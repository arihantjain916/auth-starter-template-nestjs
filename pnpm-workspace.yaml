# Packages allowed to run install scripts (pnpm 11: allowBuilds, pnpm 10: onlyBuiltDependencies)
allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  prisma: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@prisma/engines'
  - bcrypt
  - prisma
  - unrs-resolver
