# Local development: PostgreSQL and Redis. Run the API on your machine with
# `pnpm start:dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_starter
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Using MySQL instead? Replace the postgres service with this one and set
  # DATABASE_URL=mysql://root:mysql@localhost:3306/auth_starter
  # mysql:
  #   image: mysql:8.4
  #   environment:
  #     MYSQL_ROOT_PASSWORD: mysql
  #     MYSQL_DATABASE: auth_starter
  #   ports:
  #     - '3306:3306'
  #   volumes:
  #     - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
  # mysql_data:
